<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>HELIOSTAT — 5v5 Tactical FPS at a Desert Solar Farm</title>
<style>
  /* Look: warm sand + dark glass + amber accent. One accent, hairline panels. */
  :root {
    --canvas: #14100a; --surface: rgba(20, 14, 6, 0.82); --hairline: #4a3a20;
    --ink: #f5efe2; --muted: #cbb98f; --accent: #ff8c1a; --teal: #19c2b8;
    --radius: 4px; --font-ui: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-readout: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); font-family: var(--font-ui); color: var(--ink); }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }
  /* Crosshair */
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --sp: 8px; }
  #crosshair .ch { position: absolute; background: var(--ink); box-shadow: 0 0 2px #000; }
  #crosshair .t { left: -1px; top: calc(-1 * var(--sp) - 7px); width: 2px; height: 7px; }
  #crosshair .b { left: -1px; top: var(--sp); width: 2px; height: 7px; }
  #crosshair .l { top: -1px; left: calc(-1 * var(--sp) - 7px); width: 7px; height: 2px; }
  #crosshair .r { top: -1px; left: var(--sp); width: 7px; height: 2px; }
  #crosshair .dot { position: absolute; left: -1.5px; top: -1.5px; width: 3px; height: 3px; background: var(--accent); border-radius: 50%; }
  #hitmark { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px; opacity: 0; }
  #hitmark::before, #hitmark::after { content: ''; position: absolute; background: #fff; width: 2px; height: 26px; left: 12px; }
  #hitmark::before { transform: rotate(45deg); } #hitmark::after { transform: rotate(-45deg); }
  #hitmark.show { opacity: 1; } #hitmark.head::before, #hitmark.head::after { background: #ff3b30; }
  #dmgdir { position: absolute; left: 50%; top: 50%; width: 180px; height: 180px; margin: -90px; opacity: 0; --rot: 0deg; }
  #dmgdir::before { content: ''; position: absolute; left: 50%; top: 0; margin-left: -40px; width: 80px; height: 14px;
    background: radial-gradient(ellipse at center, rgba(255, 59, 48, 0.9), transparent 70%); transform: rotate(var(--rot)); transform-origin: 40px 90px; }
  #dmgdir.show { opacity: 1; }
  #vignette { position: absolute; inset: 0; pointer-events: none; }
  #vignette.hurt { box-shadow: inset 0 0 90px 30px rgba(255, 30, 10, 0.55); }
  /* Top bar */
  #tophud { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 6px 16px; font-family: var(--font-readout); }
  #tophud .team { display: flex; gap: 8px; align-items: center; font-weight: 700; }
  #tophud .tname { font-size: 13px; letter-spacing: 1px; }
  .team.atk .tname { color: var(--accent); } .team.def .tname { color: var(--teal); }
  #scoreA, #scoreB { font-size: 22px; }
  #timer { font-size: 22px; font-weight: 700; min-width: 64px; text-align: center; }
  #timer.urgent { color: #ff3b30; }
  .pips i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #554a33; margin: 0 1px; }
  .pips i.on.atk { background: var(--accent); } .pips i.on.def { background: var(--teal); }
  #bombtimer { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); background: rgba(60, 8, 4, 0.85);
    border: 1px solid #ff3b30; color: #ffd9d0; padding: 5px 14px; border-radius: var(--radius); font-family: var(--font-readout); font-weight: 700; }
  #objective { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 13px;
    background: rgba(20, 14, 6, 0.6); padding: 4px 12px; border-radius: var(--radius); white-space: nowrap; }
  #bombtimer:not(.hidden) + #objective { display: none; }
  /* Minimap */
  #minimap-wrap { position: absolute; top: 12px; right: 12px; border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  #minimap { display: block; }
  #mm-label { font-size: 10px; letter-spacing: 1px; color: var(--muted); padding: 3px 6px; font-family: var(--font-readout); }
  /* Radio + killfeed */
  #radio { position: absolute; left: 14px; bottom: 150px; width: 340px; font-size: 13px; }
  .radio-line { background: var(--surface); border-left: 3px solid var(--accent); padding: 5px 9px; margin-top: 4px; border-radius: 0 var(--radius) var(--radius) 0; }
  .radio-line.def { border-left-color: var(--teal); }
  #killfeed { position: absolute; right: 14px; top: 170px; text-align: right; font-size: 13px; font-family: var(--font-readout); }
  .kf-line { background: var(--surface); padding: 4px 9px; margin-top: 4px; border-radius: var(--radius); }
  .kf-k { color: var(--accent); font-weight: 700; } .kf-v { color: var(--teal); font-weight: 700; } .kf-w { color: var(--muted); }
  /* Bottom HUD */
  #bottomhud { position: absolute; left: 50%; transform: translateX(-50%); bottom: 16px; display: flex; gap: 18px; align-items: flex-end; }
  #bottomhud > div { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 8px 14px; }
  .lbl { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); }
  #health .bar, #armor .bar { width: 150px; height: 8px; background: #3a2f1c; margin: 4px 0; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  #arfill { background: var(--teal) !important; }
  #hpnum, #arnum { font-family: var(--font-readout); font-size: 20px; font-weight: 700; }
  #money { font-family: var(--font-readout); font-size: 22px; font-weight: 700; color: #7dd87d; }
  #wname { font-size: 12px; color: var(--muted); }
  #ammo { text-align: right; }
  #ammomag { font-family: var(--font-readout); font-size: 30px; font-weight: 700; }
  #ammores { font-family: var(--font-readout); color: var(--muted); font-size: 16px; }
  /* Banner */
  #banner { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); text-align: center; }
  #banner-title { font-size: 40px; font-weight: 800; letter-spacing: 2px; color: var(--accent); text-shadow: 0 2px 18px rgba(0,0,0,0.8); }
  #banner-sub { font-size: 15px; color: var(--ink); text-shadow: 0 1px 6px #000; margin-top: 6px; }
  #plantbar { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); width: 300px; text-align: center; }
  #plantbar .bar { height: 10px; background: #3a2f1c; border: 1px solid var(--hairline); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  #plantfill { display: block; height: 100%; background: var(--accent); width: 0; }
  /* Buy menu */
  #buymenu { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 560px; background: rgba(16, 11, 4, 0.94);
    border: 1px solid var(--hairline); border-radius: 6px; padding: 20px 24px; pointer-events: auto; }
  #buymenu h2 { margin: 0 0 14px; font-size: 20px; letter-spacing: 1px; color: var(--accent); }
  #buymoney { float: right; color: #7dd87d; font-family: var(--font-readout); }
  .buyitem { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--hairline); border-radius: var(--radius); margin-top: 6px; cursor: pointer; }
  .buyitem:hover { border-color: var(--accent); background: rgba(255, 140, 26, 0.08); }
  .buyitem.cant { opacity: 0.45; }
  .bkey { background: var(--accent); color: #14100a; font-weight: 800; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 3px; }
  .bname { font-weight: 700; flex: 1; } .bstat { color: var(--muted); font-size: 12px; } .bprice { font-family: var(--font-readout); color: #7dd87d; font-weight: 700; }
  .buyfoot { margin-top: 12px; font-size: 12px; color: var(--muted); }
  /* Start menu */
  #startmenu { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(20, 10, 2, 0.25), rgba(20, 10, 2, 0.72)); pointer-events: auto; }
  .sm-inner { text-align: center; max-width: 640px; padding: 30px; }
  .sm-kicker { letter-spacing: 3px; font-size: 12px; color: var(--muted); }
  .sm-inner h1 { font-size: 74px; margin: 8px 0 4px; letter-spacing: 6px; color: var(--accent); text-shadow: 0 4px 30px rgba(255, 140, 26, 0.45); }
  .sm-sub { font-size: 17px; color: var(--ink); }
  .sm-rules { text-align: left; margin: 22px auto; font-size: 14px; line-height: 1.65; color: #e8dcc2; background: var(--surface); border: 1px solid var(--hairline); border-radius: 6px; padding: 14px 18px; }
  .sm-rules div { margin: 4px 0; }
  #playbtn { font-size: 20px; font-weight: 800; letter-spacing: 1px; padding: 14px 34px; background: var(--accent); color: #14100a; border: none; border-radius: 6px; cursor: pointer; }
  #playbtn:hover { filter: brightness(1.12); }
  .sm-controls { margin-top: 16px; font-size: 12px; color: var(--muted); }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
